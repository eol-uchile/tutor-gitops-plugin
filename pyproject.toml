[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tutor-gitops"
version = "0.1.0"
description = "GitOps plugin for Tutor"
authors = [
    { name = "EOL", email = "eol-ing@uchile.cl" },
]
dependencies = [
    "tutor<13.0.0,>=12.0.0",
]

[project.entry-points."tutor.plugin.v0"]
gitops = "gitops.plugin"

[tool.hatch.build.targets.wheel]
packages = ["gitops"]
